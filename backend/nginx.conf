# nginx 反向代理（最小版，参考配置）
# 用法：可整体挂载为主 nginx.conf（监听 80 转发到后端 8000），或用相同指令写成
#       一个 site（server 块）。TLS/证书由 certbot 或负载均衡处理。
#
# ⚠️ /chat 是 SSE 流。要真正实时转发 token，下面三条缺一不可（生产实测）：
#   1. proxy_buffering off;           —— 否则整段响应会被 nginx 缓冲，请求处理完才一次性下发给客户端
#   2. 若 http 层开了 gzip（Ubuntu 默认 `gzip on;`），必须让 /chat 不做 gzip：
#      proxy_set_header Accept-Encoding "";  —— 压缩会让 nginx 无法边读边发，强制缓冲整段
#   3. proxy_http_version 1.1;  +  chunked_transfer_encoding on;  —— SSE 走流式 chunked

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream agent_backend {
        server agent:8000;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://agent_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;

            # 禁止对 /chat 的 SSE 做 gzip（压缩会强制缓冲整段响应，打断实时流）。
            # 覆盖 http 层的 `gzip on;`，只对这个 location 关闭。
            proxy_set_header Accept-Encoding "";

            # SSE 必须关缓冲：token 边到边转发，不被整段积压。
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }
    }
}